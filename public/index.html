<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SukiGo Capacitor Shell</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f7faf8;
      color: #0f172a;
    }
    .card {
      max-width: 720px;
      margin: 40px auto;
      background: #ffffff;
      border: 1px solid #dbe3ea;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
    }
    code {
      background: #eef2f7;
      border-radius: 6px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SukiGo Android Shell Ready</h1>
    <p>This is a fallback Capacitor web shell.</p>
    <p>
      To load your real Next.js app in Android WebView, set
      <code>CAP_SERVER_URL</code> before running Capacitor sync/build.
    </p>
    <p>Example (PowerShell):</p>
    <p><code>$env:CAP_SERVER_URL="https://your-web-app-domain"; npx cap sync android</code></p>
  </div>
</body>
</html>
